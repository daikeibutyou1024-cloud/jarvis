name: JARVIS offline checks
on:
  workflow_dispatch:
  push:
    branches: [feature/ai-business-rebuild]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm test
